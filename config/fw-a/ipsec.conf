# Túnel IPsec site-to-site (IKEv2, PSK) entre fw-a y fw-b
# Túnel basado en políticas, como los túneles clásicos de Check Point.
# La clave compartida NO está aquí: se genera en ipsec.secrets al arrancar
# a partir de la variable IPSEC_PSK del archivo .env (ignorado por git).

config setup
    uniqueids=no
    charondebug="ike 1, knl 1, cfg 0, net 0"

conn site-to-site
    keyexchange=ikev2
    type=tunnel
    authby=psk
    left=203.0.113.10
    leftid=@fw-a
    leftsubnet=10.10.1.0/24,10.10.2.0/24
    right=203.0.113.20
    rightid=@fw-b
    rightsubnet=10.20.1.0/24,10.20.2.0/24
    ike=aes256-sha256-modp2048!
    esp=aes256gcm16-modp2048!
    keyingtries=%forever
    auto=start
